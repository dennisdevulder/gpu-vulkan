/*
 * gpu-vulkan - RuneLite external plugin
 *
 * Plain Java/Groovy Gradle build. Shaders compile at build time via
 * glslangValidator and are placed on the classpath at
 * /com/gpuvulkan/.
 */

plugins {
	id 'java'
}

repositories {
	mavenLocal {
		content {
			includeGroupAndSubgroups('net.runelite')
		}
	}
	maven {
		url = uri('https://repo.runelite.net')
		content {
			includeGroupAndSubgroups('net.runelite')
		}
	}
	mavenCentral()
}

group = 'com.gpuvulkan'
version = '1.0.0'

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.gpuvulkan.GpuVulkanPluginTest'
// LWJGL core comes from runelite-client at runtime (3.3.2 classes AND
// natives; RuneLite's plugin classloader is child-first, so bundling a
// different core would shadow the client's classes against its older
// natives — the 45f09ed Windows failure). Core and JAWT stay on RuneLite's
// LWJGL line; Vulkan stays newer because the opt-in recorder uses ratified
// KHR H.264 encode bindings not present in lwjgl-vulkan 3.3.2.
def lwjglCoreVersion = '3.3.2'
def lwjglVulkanVersion = '3.3.6'
def lwjglJawtVersion = '3.3.2'
def lombokVersion = '1.18.30'

dependencies {
	compileOnly "net.runelite:client:${runeLiteVersion}"

	compileOnly "org.lwjgl:lwjgl:${lwjglCoreVersion}"
	implementation("org.lwjgl:lwjgl-vulkan:${lwjglVulkanVersion}") {
		exclude group: 'org.lwjgl', module: 'lwjgl'
	}
	implementation("org.lwjgl:lwjgl-jawt:${lwjglJawtVersion}") {
		exclude group: 'org.lwjgl', module: 'lwjgl'
	}
	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	testCompileOnly "net.runelite:client:${runeLiteVersion}"
	testImplementation 'junit:junit:4.13.2'
}

configurations {
	launcherRuntime
}

dependencies {
	launcherRuntime("net.runelite:client:${runeLiteVersion}") {
		exclude group: 'org.lwjgl', module: 'lwjgl-opencl'
	}
	launcherRuntime "net.runelite:jshell:${runeLiteVersion}"
	// Core/OpenGL natives match the client's transitive lwjgl version.
	launcherRuntime "org.lwjgl:lwjgl:${lwjglCoreVersion}:natives-linux"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglCoreVersion}:natives-linux-arm64"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglCoreVersion}:natives-windows"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglCoreVersion}:natives-windows-arm64"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglCoreVersion}:natives-macos"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglCoreVersion}:natives-macos-arm64"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglCoreVersion}:natives-linux"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglCoreVersion}:natives-linux-arm64"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglCoreVersion}:natives-windows"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglCoreVersion}:natives-windows-arm64"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglCoreVersion}:natives-macos"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglCoreVersion}:natives-macos-arm64"
}

// Compiled shader artifacts (.spv) are COMMITTED under
// src/main/resources so the Plugin Hub's builder — which has neither
// glslangValidator nor clang — packages a working jar. With the toolchain
// installed the tasks below regenerate them in place; without it they skip
// and the committed binaries ship as-is.
def gpuVulkanShaderSrc = file('src/main/shaders/gpuvulkan')
def gpuVulkanResourceOut = file('src/main/resources/com/gpuvulkan')
def glslangValidator = providers.environmentVariable('GLSLANG').getOrElse('glslangValidator')

def toolOnPath = { tool ->
	def path = System.getenv('PATH') ?: ''
	new File(tool).isAbsolute()
		? new File(tool).canExecute()
		: path.split(File.pathSeparator).any { new File(it, tool).canExecute() }
}

def compileGpuVulkanShaders = tasks.register('compileGpuVulkanShaders') {
	group = 'build'
	description = 'Regenerate the committed SPIR-V from GLSL (needs glslangValidator)'

	inputs.dir(gpuVulkanShaderSrc)
	outputs.dir(gpuVulkanResourceOut)
	onlyIf { toolOnPath(glslangValidator) }

	doLast {
		gpuVulkanResourceOut.mkdirs()
		fileTree(gpuVulkanShaderSrc).matching {
			include '**/*.vert', '**/*.frag', '**/*.comp', '**/*.geom'
		}.each { src ->
			def outFile = new File(gpuVulkanResourceOut, "${src.name}.spv")
			def result = providers.exec {
				commandLine glslangValidator, '-V', src.absolutePath, '-o', outFile.absolutePath
			}.result.get()
			if (result.exitValue != 0) {
				throw new GradleException("glslangValidator failed for ${src}")
			}
		}
	}
}

// Guard against editing a shader without the toolchain: the committed .spv
// would silently go stale and ship. Do not use file mtimes here: Git checkouts
// on Windows can make sources newer than committed binaries even when clean.
def checkGpuVulkanShadersFresh = tasks.register('checkGpuVulkanShadersFresh') {
	group = 'verification'
	description = 'Fail when a changed shader source has no changed committed .spv'

	doLast {
		fileTree(gpuVulkanShaderSrc).matching {
			include '**/*.vert', '**/*.frag', '**/*.comp', '**/*.geom'
		}.each { src ->
			def spv = new File(gpuVulkanResourceOut, "${src.name}.spv")
			if (!spv.exists()) {
				throw new GradleException("${src.name} has no committed .spv - " +
					"install glslangValidator and run compileGpuVulkanShaders")
			}
			if (toolOnPath('git')) {
				def srcStatus = new ByteArrayOutputStream()
				def spvStatus = new ByteArrayOutputStream()
				exec {
					commandLine 'git', 'status', '--porcelain', '--', src
					standardOutput = srcStatus
					errorOutput = new ByteArrayOutputStream()
					ignoreExitValue = true
				}
				exec {
					commandLine 'git', 'status', '--porcelain', '--', spv
					standardOutput = spvStatus
					errorOutput = new ByteArrayOutputStream()
					ignoreExitValue = true
				}
				if (srcStatus.toString('UTF-8').trim() && !spvStatus.toString('UTF-8').trim()) {
					throw new GradleException("${src.name} changed without its committed .spv - " +
						"install glslangValidator and run compileGpuVulkanShaders")
				}
			}
		}
	}
}

processResources {
	dependsOn compileGpuVulkanShaders
	dependsOn checkGpuVulkanShadersFresh
	from(projectDir) {
		include 'runelite-plugin.properties'
	}
}
checkGpuVulkanShadersFresh.configure {
	mustRunAfter compileGpuVulkanShaders
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial']
}

tasks.withType(Test).configureEach {
	useJUnit()
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath + sourceSets.test.output + configurations.launcherRuntime
	mainClass = pluginMainClass
	jvmArgs '-ea',
		'--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED',
		'--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
	// Forward -Dvkgpu.* from the gradle invocation into the client JVM, so the
	// renderer escape hatches are reachable without editing this file.
	systemProperties providers.systemPropertiesPrefixedBy('vkgpu.').get()
	args '--developer-mode', '--debug'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.runtimeClasspath, configurations.launcherRuntime, 'classes', 'testClasses'
	manifest {
		attributes(
			'Main-Class': pluginMainClass,
			'Multi-Release': true,
			'Add-Exports': 'java.desktop/com.apple.eawt',
			'Add-Opens': 'java.base/java.lang.reflect'
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	from {
		configurations.launcherRuntime.collect { it.isDirectory() ? it : zipTree(it) }
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'
	exclude 'runelite-plugin.properties'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier = 'shadow'
	archiveFileName = "${rootProject.name}-${project.version}-all.jar"
}

tasks.register('pluginJar', Jar) {
	dependsOn configurations.runtimeClasspath, 'classes'
	manifest {
		attributes(
			'Multi-Release': true,
			'Add-Exports': 'java.desktop/com.apple.eawt'
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'
	exclude 'runelite-plugin.properties'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier = 'plugin'
	archiveFileName = "${rootProject.name}-${project.version}-plugin.jar"
}
