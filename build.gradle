/*
 * gpu-vulkan - RuneLite external plugin
 *
 * Plain Java/Groovy Gradle build. Shaders compile at build time via
 * glslangValidator and are placed on the classpath at
 * /net/runelite/client/plugins/gpuvulkan/.
 */

plugins {
	id 'java'
}

repositories {
	mavenLocal {
		content {
			includeGroupAndSubgroups('net.runelite')
		}
	}
	maven {
		url = uri('https://repo.runelite.net')
		content {
			includeGroupAndSubgroups('net.runelite')
		}
	}
	mavenCentral()
}

group = 'net.runelite.client.plugins.gpuvulkan'
version = '0.1.0'

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

def runeLiteVersion = '1.12.28'
def pluginMainClass = 'net.runelite.client.plugins.gpuvulkan.GpuVulkanPluginTest'
// Keep core and vulkan on the SAME version — a 3.3.6/3.3.2 mix broke Windows
// once already (45f09ed). 3.3.4+ is required for the finalized
// (non-provisional) Vulkan video encode bindings the recorder uses.
def lwjglVersion = '3.3.6'
def lwjglVulkanVersion = '3.3.6'
def lombokVersion = '1.18.34'

dependencies {
	compileOnly "net.runelite:client:${runeLiteVersion}"
	compileOnly 'net.runelite:rlawt:1.8'

	implementation "org.lwjgl:lwjgl:${lwjglVersion}"
	implementation "org.lwjgl:lwjgl-vulkan:${lwjglVulkanVersion}"
	implementation "org.lwjgl:lwjgl-jawt:${lwjglVulkanVersion}"

	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	testCompileOnly "net.runelite:client:${runeLiteVersion}"
	testImplementation 'junit:junit:4.13.2'
}

configurations {
	launcherRuntime
}

dependencies {
	launcherRuntime("net.runelite:client:${runeLiteVersion}") {
		exclude group: 'org.lwjgl', module: 'lwjgl-opencl'
	}
	launcherRuntime "net.runelite:jshell:${runeLiteVersion}"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux-arm64"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows-arm64"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglVersion}:natives-macos"
	launcherRuntime "org.lwjgl:lwjgl:${lwjglVersion}:natives-macos-arm64"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-linux"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-linux-arm64"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-windows"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-windows-arm64"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-macos"
	launcherRuntime "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-macos-arm64"
	launcherRuntime "org.lwjgl:lwjgl-vulkan:${lwjglVulkanVersion}:natives-macos"
	launcherRuntime "org.lwjgl:lwjgl-vulkan:${lwjglVulkanVersion}:natives-macos-arm64"
}

def gpuVulkanShaderSrc = file('src/main/shaders/gpuvulkan')
def gpuVulkanShaderOut = layout.buildDirectory
	.dir('generated/resources/net/runelite/client/plugins/gpuvulkan')
	.get()
	.asFile
def gpuVulkanNativeSrc = file('src/main/native/rlmtl.m')
def gpuVulkanNativeOut = new File(gpuVulkanShaderOut, 'librlmtl.dylib')
def glslangValidator = providers.environmentVariable('GLSLANG').getOrElse('glslangValidator')

def compileGpuVulkanShaders = tasks.register('compileGpuVulkanShaders') {
	group = 'build'
	description = 'Compile gpuvulkan GLSL shaders to SPIR-V'

	inputs.dir(gpuVulkanShaderSrc)
	outputs.dir(gpuVulkanShaderOut)

	doLast {
		gpuVulkanShaderOut.mkdirs()
		delete fileTree(gpuVulkanShaderOut).matching {
			include '**/*.spv'
		}
		fileTree(gpuVulkanShaderSrc).matching {
			include '**/*.vert', '**/*.frag', '**/*.comp', '**/*.geom'
		}.each { src ->
			def outFile = new File(gpuVulkanShaderOut, "${src.name}.spv")
			def result = providers.exec {
				commandLine glslangValidator, '-V', src.absolutePath, '-o', outFile.absolutePath
			}.result.get()
			if (result.exitValue != 0) {
				throw new GradleException("glslangValidator failed for ${src}")
			}
		}
	}
}

def compileMacOSMetalHelper = tasks.register('compileMacOSMetalHelper') {
	group = 'build'
	description = 'Compile the macOS CAMetalLayer/JAWT helper used by Vulkan present.'

	inputs.file(gpuVulkanNativeSrc)
	outputs.file(gpuVulkanNativeOut)
	onlyIf { System.getProperty('os.name', '').toLowerCase().contains('mac') }

	doLast {
		gpuVulkanShaderOut.mkdirs()
		def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
		exec {
			commandLine 'clang',
				'-fno-objc-arc',
				'-shared',
				'-dynamiclib',
				'-arch', 'arm64',
				'-arch', 'x86_64',
				'-framework', 'Cocoa',
				'-framework', 'QuartzCore',
				'-framework', 'Metal',
				'-I', "${javaHome}/include",
				'-I', "${javaHome}/include/darwin",
				'-Wl,-undefined,dynamic_lookup',
				gpuVulkanNativeSrc.absolutePath,
				'-o', gpuVulkanNativeOut.absolutePath
		}
		exec {
			commandLine 'codesign', '--force', '--sign', '-', gpuVulkanNativeOut.absolutePath
		}
	}
}

sourceSets {
	main {
		resources {
			srcDir layout.buildDirectory.dir('generated/resources')
		}
	}
}

processResources {
	dependsOn compileGpuVulkanShaders
	dependsOn compileMacOSMetalHelper
	from(projectDir) {
		include 'runelite-plugin.properties'
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial']
}

tasks.withType(Test).configureEach {
	useJUnit()
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath + sourceSets.test.output + configurations.launcherRuntime
	mainClass = pluginMainClass
	jvmArgs '-ea', '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED'
	args '--developer-mode', '--debug'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.runtimeClasspath, configurations.launcherRuntime, 'classes', 'testClasses'
	manifest {
		attributes(
			'Main-Class': pluginMainClass,
			'Multi-Release': true,
			'Add-Exports': 'java.desktop/com.apple.eawt'
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	from {
		configurations.launcherRuntime.collect { it.isDirectory() ? it : zipTree(it) }
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'
	exclude 'runelite-plugin.properties'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier = 'shadow'
	archiveFileName = "${rootProject.name}-${project.version}-all.jar"
}

tasks.register('pluginJar', Jar) {
	dependsOn configurations.runtimeClasspath, 'classes'
	manifest {
		attributes(
			'Multi-Release': true,
			'Add-Exports': 'java.desktop/com.apple.eawt'
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'
	exclude 'runelite-plugin.properties'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier = 'plugin'
	archiveFileName = "${rootProject.name}-${project.version}-plugin.jar"
}
